<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Amber badge gradient (light top-left → deep amber bottom-right) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1"   stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft top-left gloss -->
    <radialGradient id="gloss" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Head circle: white → light amber -->
    <linearGradient id="headGrad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Left check arm: white → shaded amber -->
    <linearGradient id="leftArm" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>

    <!-- Right check arm: white → deep amber tip -->
    <linearGradient id="rightArm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#fef3c7"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.7"  stop-color="#fde68a"/>
      <stop offset="1"    stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#92400e" flood-opacity="0.35"/>
    </filter>

    <clipPath id="squircle"><rect x="32" y="32" width="448" height="448" rx="112"/></clipPath>
  </defs>

  <!-- Rounded-square badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)"/>

  <!-- Gloss + diagonal sheen, clipped to the badge -->
  <g clip-path="url(#squircle)">
    <rect x="32" y="32" width="448" height="448" fill="url(#gloss)"/>
    <path d="M32 320 L480 96 L480 32 L32 32 Z" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- Person "head" -->
  <circle cx="256" cy="166" r="62" fill="url(#headGrad)" filter="url(#soft)"/>

  <!-- Checkmark (two arms so the joint shading matches the original) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M124 254 L226 386" stroke="url(#leftArm)"  stroke-width="70"/>
    <path d="M226 386 L442 174" stroke="url(#rightArm)" stroke-width="70"/>
  </g>
</svg>