name: Quality, Security and Build

on:
  pull_request:
  push:
    branches: [dev, stable, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Renamed from 'test' to 'e2e' for clarity
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PORT: 3100
      HOSTNAME: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx --no-install playwright install chromium

      - name: Start dev server
        run: |
          npm run dev -- --port $PORT > /tmp/nextjs.log 2>&1 &
          echo $! > /tmp/nextjs.pid
        shell: bash

      - name: Wait for dev server
        run: npx --yes wait-on http://127.0.0.1:$PORT --timeout 120000
        shell: bash

      - name: Run e2e tests
        run: npm run test:e2e

      # Only dumps logs if tests fail, keeping successful runs clean
      - name: Dump server logs on failure
        if: failure()
        run: cat /tmp/nextjs.log

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build